<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySync | Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            padding: 40px; 
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #ddd; 
        }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        
        /* Cores dinâmicas para os Status */
        .status-APPROVED { color: #27ae60; font-weight: bold; }
        .status-REJECTED { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Extrato de Conciliação</h1>
        <button onclick="forcarConciliacao()" style="background-color: #f39c12; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 20px;"> ⚙️ Forçar Fechamento de Caixa </button>
        <table>
            <thead>
                <tr>
                    <th>ID da Transação</th>
                    <th>Gateway</th>
                    <th>Moeda</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-pagamentos">
                </tbody>
        </table>
    </div>

    <script>
        // Função assíncrona para buscar os dados na nossa API
        async function carregarExtrato() {
            try {
                // Faz a requisição GET para o nosso servidor Java na porta 8081
                const resposta = await fetch('http://localhost:8081/api/ledger/payments');
                const pagamentos = await resposta.json();
                
                const corpoTabela = document.getElementById('tabela-pagamentos');
                corpoTabela.innerHTML = ''; // Limpa o aviso de carregamento

                // Para cada pagamento no banco de dados, cria uma linha na tabela
                pagamentos.forEach(pagamento => {
                    const linha = document.createElement('tr');
                    
                    linha.innerHTML = `
                        <td>${pagamento.transactionId}</td>
                        <td>${pagamento.gateway}</td>
                        <td>${pagamento.currency}</td>
                        <td>R$ ${pagamento.amount.toFixed(2)}</td>
                        <td class="status-${pagamento.status}">${pagamento.status}</td>
                    `;
                    
                    corpoTabela.appendChild(linha);
                });

            } catch (erro) {
                console.error('Falha ao conectar com a API:', erro);
                document.getElementById('tabela-pagamentos').innerHTML = `
                    <tr><td colspan="5" style="color: red; text-align: center;">
                        ⚠️ Erro de conexão. Verifique se o servidor Spring Boot está rodando na porta 8081.
                    </td></tr>`;
            }
        }

        // Função para acionar o robô manualmente
        async function forcarConciliacao() {
            try {
                // Dispara um POST para a nossa nova rota
                const resposta = await fetch('http://localhost:8081/api/ledger/reconcile', {
                    method: 'POST'
                });
                
                if (resposta.ok) {
                    alert('✅ Sucesso! Olhe o terminal do seu VS Code para ver o relatório de fechamento gerado na hora.');
                }
            } catch (erro) {
                alert('❌ Erro ao tentar forçar a conciliação.');
            }
        }
        // Executa a função automaticamente quando a página é aberta
        carregarExtrato();
    </script>
</body>
</html>
